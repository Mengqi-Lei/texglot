<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>TeXGlot</title>
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f5f5f7;color:#1d1d1f;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}img{width:76px;height:76px;object-fit:contain}h1{font-size:28px;font-weight:600;letter-spacing:-.8px;margin:18px 0 10px}p{color:#86868b;margin:0}.spinner{width:19px;height:19px;border:2px solid #d7e4f4;border-top-color:#0071e3;border-radius:50%;margin:28px auto;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body><main><img src="build/icon.png" alt="TeXGlot"><h1>TeXGlot</h1><p id="status">正在启动本地翻译服务…</p><div class="spinner"></div></main><script>if(new URLSearchParams(location.search).get('lang')==='en')document.getElementById('status').textContent='Starting your local translation service…';</script></body></html>
